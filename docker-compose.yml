services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social_api"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-services:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  social-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://social:social@postgres:5432/social_api"
      READ_DATABASE_URL: "postgres://social:social@postgres:5432/social_api"
      REDIS_URL: "redis://redis:6379"
      CONTENT_API_POST_URL: "http://mock-services:8081"
      CONTENT_API_BONUS_HUNTER_URL: "http://mock-services:8082"
      CONTENT_API_TOP_PICKS_URL: "http://mock-services:8083"
      PROFILE_API_URL: "http://mock-services:8084"
      RATE_LIMIT_WRITE: "30"
      RATE_LIMIT_READ: "1000"
      CACHE_TTL_COUNT: "60"
      CACHE_TTL_CONTENT_VALIDATION: "300"
      RUST_LOG: "social_api=info"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-services:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
