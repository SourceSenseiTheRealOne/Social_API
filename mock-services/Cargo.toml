[package]
name = "mock-services"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mock profile and content API services for local development"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
